<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Калькулятор печати</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f0f0ed;--card:#fff;--card2:#f7f7f5;--line:#e2e2de;--line-soft:#eeeeea;
  --text:#1a1a18;--muted:#6b6b66;--accent:#1a1a18;--accent-fg:#fff;
  --danger:#c0392b;--danger-soft:#fdf0ef;--green:#1a7a4a;--green-soft:#edf7f2;
  --radius:16px;--radius-sm:10px;--shadow:0 2px 12px rgba(0,0,0,.07);
}
body{margin:0;font-family:'Geologica',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app-header{background:var(--accent);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.app-logo{display:flex;align-items:center;gap:12px}
.app-logo-icon{width:34px;height:34px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.app-title{font-size:20px;font-weight:800;margin:0}
.app-subtitle{font-size:11px;opacity:.55;margin:0}
.header-actions{display:flex;gap:10px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.status-pill{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;display:none;align-items:center}
.status-pill.error{color:var(--danger);border-color:#f5c6c2;background:var(--danger-soft)}
button{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:10px 18px;font-weight:700;font-size:14px;font-family:inherit;transition:opacity .15s,transform .1s}
button:hover{opacity:.85}
button:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #f5c6c2}
.btn-ghost{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.btn-ghost:hover{color:var(--text);border-color:var(--text);opacity:1}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px}
.btn-xs{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-inverse{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-inverse:hover{background:rgba(255,255,255,.25);opacity:1}
.icon-btn{width:36px;min-width:36px;height:36px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn.locked{background:var(--accent);color:#fff;border-color:var(--accent)}
.icon-btn.remove-extra{color:var(--danger);border-color:#f5c6c2;background:var(--danger-soft)}
.service-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}
.card-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft);background:var(--card2)}
.card-type-badge{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:4px 10px;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.card-type-badge.separator{color:#1a5fa0;border-color:#c3daf5;background:#eff6fd}
.card-type-badge.folding{color:#7a4a1a;border-color:#f5dfc3;background:#fdf6ef}
.card-type-badge.guillotine{color:#1a7a4a;border-color:#b8e4cc;background:#edf7f2}
.card-type-badge.binding{color:#6a1a7a;border-color:#ddb8e4;background:#f7edfb}
.card-type-badge.converter{color:#1a4a7a;border-color:#b8cce4;background:#edf2fb}
.card-name-input{flex:1;min-width:0;padding:7px 11px;border:1px solid transparent;border-radius:8px;font-size:15px;font-weight:700;font-family:inherit;background:transparent;color:var(--text);transition:border-color .15s,background .15s}
.card-name-input:focus{outline:none;border-color:var(--line);background:var(--card)}
.card-body{padding:20px}
.card-footer{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;background:var(--card2)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col-span-full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=number],select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--card);color:var(--text);height:42px;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,26,24,.08)}
input[type=number]{text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{display:none}
.file-upload-area{border:2px dashed var(--line);border-radius:var(--radius-sm);padding:18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--card2)}
.file-upload-area:hover,.file-upload-area.dragover{border-color:var(--accent);background:#f5f5f2}
.file-upload-icon{font-size:26px;margin-bottom:6px}
.file-upload-label{font-size:14px;font-weight:600}
.file-upload-hint{font-size:12px;color:var(--muted);margin-top:4px}
.file-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file-chip{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--green-soft);border:1px solid #b8e4cc;border-radius:8px;font-size:13px}
.file-chip-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--green);font-weight:600}
.file-chip-remove{cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px;background:none;border:none}
.file-chip-remove:hover{color:var(--danger)}
.result-section{border-top:2px solid var(--line-soft);display:none}
.result-section.visible{display:block}
.result-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;user-select:none}
.result-header:hover{background:var(--card2)}
.result-title{font-size:15px;font-weight:700}
.result-subtotal{font-size:18px;font-weight:800;color:var(--accent)}
.result-chevron{font-size:16px;color:var(--muted);transition:transform .2s}
.result-chevron.open{transform:rotate(180deg)}
.result-body{padding:0 20px 18px}
.result-body.collapsed{display:none}
.download-actions{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.table-wrap{width:100%;overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:#fff;min-width:600px}
th,td{vertical-align:middle;padding:10px 13px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
th{background:#f7f7f5;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);white-space:nowrap;text-align:center}
td{text-align:left}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.cell-code{font-size:12px;color:var(--muted);font-weight:500}
.cell-label{font-size:13px;font-weight:500;line-height:1.3;word-break:keep-all;overflow-wrap:normal;hyphens:none}
.cell-size{font-size:13px;font-family:monospace;color:var(--muted)}
.sum-cell{font-size:16px;font-weight:800;white-space:nowrap;text-align:right!important}
.row-qty-input,.row-price-input{width:86px;text-align:center;height:36px;padding:6px 9px;font-size:13px}
.price-edit-box{display:flex;align-items:center;gap:6px}
.note-box{margin-top:12px;padding:11px 15px;background:#fffbee;border:1px solid #f0e0a0;border-radius:var(--radius-sm);font-size:13px;line-height:1.6;color:#5a4a00}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:8px;flex-wrap:wrap}
.total-block{background:var(--accent);color:#fff;border-radius:var(--radius);padding:16px 26px;display:none}
.total-block.visible{display:block}
.total-label{font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.total-amount{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1}
.progress-bar-wrap{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden;display:none}
.progress-bar-wrap.visible{display:block}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}
.fold-line-grid{display:grid;grid-template-columns:1fr 1fr 90px 36px;gap:10px;align-items:end;margin-bottom:10px}
/* Guillotine */
.g-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
.g-phase-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:16px 0 8px;padding:8px 12px;background:var(--card2);border-radius:8px}
.g-step{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;border-radius:10px;border:1px solid var(--line);margin-bottom:7px;background:#fff}
.g-step-check{cursor:pointer}
.g-step-check:hover .g-step-num{background:var(--green)}
.g-step-done{opacity:.42}
.g-step-done .g-step-num{background:var(--green)!important}
.g-step-done .g-step-action{text-decoration:line-through;color:var(--muted)}
.g-step-num{width:27px;min-width:27px;height:27px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.g-step-body{flex:1}
.g-step-action{font-size:14px;font-weight:700;margin-bottom:4px}
.g-step-detail{font-size:13px;color:var(--muted);line-height:1.5}
.g-step-values{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.g-val-chip{background:#f0f0ed;border:1px solid var(--line);border-radius:8px;padding:4px 11px;font-size:13px;font-weight:600}
.g-val-chip span{color:var(--muted);font-weight:400;font-size:12px}
.g-summary{background:var(--green-soft);border:1px solid #b8e4cc;border-radius:12px;padding:14px 18px;margin-bottom:14px;font-size:14px;line-height:1.6}
.g-warn{background:#fffbee;border:1px solid #f0e0a0;border-radius:10px;padding:11px 15px;font-size:13px;color:#5a4a00;margin-bottom:10px}
.g-advanced-toggle{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0;font-family:inherit;text-decoration:underline}
.g-advanced-toggle:hover{color:var(--text)}
.g-orient{width:34px;height:34px;min-width:34px;border:1.5px solid var(--accent);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:#fff;color:var(--accent)}
.g-phase-head{display:flex;align-items:center;gap:12px;margin:18px 0 8px}
.g-phase-head-text{font-size:13px;font-weight:700;color:var(--text)}
.g-phase-head-sub{font-size:12px;color:var(--muted);font-weight:400}
.g-flip-note{margin-top:6px;font-size:12px;color:#1a5fa0;font-weight:600}
.g-dial-primary{font-size:22px;font-weight:800;color:var(--accent)}
.g-dial-sub{font-size:12px;color:var(--muted);margin-top:2px}
/* Row select */
.row-format-select{height:36px;padding:6px 10px;font-size:13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:inherit}
@media(max-width:768px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .app-header{padding:13px 16px}
  .wrap{padding:16px 12px 36px}
  .card-body,.result-body{padding:14px}
  .card-header,.card-footer{padding:13px 15px}
  .total-amount{font-size:30px}
  .bottom-bar{flex-direction:column;align-items:stretch}
  .fold-line-grid{grid-template-columns:1fr 1fr 80px 36px}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">
    <div class="app-logo-icon">🖨</div>
    <div>
      <div class="app-title">Калькулятор печати</div>
      <div class="app-subtitle">Разделитель · Фальцовка · Гильотина · Брошюровка · Конвертер</div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="btn-primary" id="addSeparatorBtn">+ Разделитель</button>
    <button class="btn-secondary" id="addFoldingBtn">+ Фальцовка</button>

    <button class="btn-secondary" id="addConverterBtn">+ Конвертер</button>

  </div>
  <div id="servicesContainer"></div>
  <div class="bottom-bar">
    <div></div>
    <div id="totalBlock" class="total-block">
      <div class="total-label">Итого</div>
      <div id="totalAmount" class="total-amount"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    return;

const FOLD_DIRECTION_OPTS = [

// ── addBlock ───────────────────────────────────────────────────────
function addBlock(type) {
  const id = blockCounter++;
  serviceStates[id] = {
    type,
    files: type==='separator'||type==='converter' ? [] : undefined,
    rows: [],
    notes: [],
    collapsed: false,
    foldLines:   type==='folding'  ? [{direction:'A2-A4',format:'A2',qty:1}] : undefined,
    bindingLines:type==='binding'  ? [{key:'plastic_a4',sheets:40,copies:1}] : undefined
  };

  const badges = {
    separator:'📄 Разделитель', folding:'📐 Фальцовка',
    binding:'📚 Брошюровка', guillotine:'✂️ Гильотина', converter:'🔄 Конвертер'
  };
  const defaults = {
    separator:`Разделитель #${id}`, folding:`Фальцовка #${id}`,
    binding:`Брошюровка #${id}`, guillotine:`Гильотина #${id}`, converter:`Конвертер #${id}`
  };

  const card = document.createElement('div');
  card.className = 'service-card';
  card.dataset.id = id;
  card.dataset.type = type;

  const bodyHtml = type==='separator' ? renderSeparatorBody(id)
    : type==='folding'   ? renderFoldingBody(id)
    : type==='binding'   ? renderBindingBody(id)
    : type==='guillotine'? renderGuillotineBody(id)
    : renderConverterBody(id);

  const footerHtml = type==='separator' ? `
    <div class="card-footer">
      <button type="button" class="btn-primary calc-btn">Рассчитать</button>
      <div class="progress-bar-wrap" id="progress-wrap-${id}"><div class="progress-bar-fill" id="progress-bar-${id}"></div></div>
    </div>
    <div class="result-section" id="result-${id}">
      <div class="result-header" id="result-header-${id}">
        <div class="result-title">Результат</div>
        <div style="display:flex;align-items:center;gap:14px;">
          <div class="result-subtotal" id="result-subtotal-${id}"></div>
          <div class="result-chevron open" id="result-chevron-${id}">▾</div>
        </div>
      </div>
      <div class="result-body" id="result-body-${id}"></div>
    </div>` : '';

  card.innerHTML = `
    <div class="card-header">
      <span class="card-type-badge ${type}">${badges[type]}</span>
      <input type="text" class="card-name-input" value="${escapeHtml(defaults[type])}" placeholder="Название">
      <button type="button" class="btn-danger btn-sm remove-card-btn">✕</button>
    </div>
    <div class="card-body">${bodyHtml}</div>
    ${footerHtml}`;

  container.appendChild(card);
  bindCard(card, id, type);
}

function bindCard(card, id, type) {
  card.querySelector('.remove-card-btn').addEventListener('click', () => {
    delete serviceStates[id];
    card.remove();
    rebuildRows();
    updateTotal();
  });
  if (type==='separator') {
    card.querySelector('.calc-btn').addEventListener('click', () => calcBlock(card, id));
    document.getElementById(`result-header-${id}`).addEventListener('click', () => {
      const st = serviceStates[id];
      st.collapsed = !st.collapsed;
      document.getElementById(`result-body-${id}`).classList.toggle('collapsed', st.collapsed);
      document.getElementById(`result-chevron-${id}`).classList.toggle('open', !st.collapsed);
    });
    bindSeparatorFiles(card, id);
  } else if (type==='folding') {
    buildFoldUI(card, id);
  } else if (type==='binding') {
    buildBindingUI(card, id);
  } else if (type==='guillotine') {
    initGuillotine(card, id);
  } else if (type==='converter') {
    initConverter(card, id);
  }
}

function bindSeparatorFiles(card, id) {
  const area  = document.getElementById(`sep-area-${id}`);
  const input = document.getElementById(`sep-input-${id}`);
  const list  = document.getElementById(`sep-list-${id}`);
  const st    = serviceStates[id];
  area.addEventListener('click', () => input.click());
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => { e.preventDefault(); area.classList.remove('dragover'); pushFiles([...e.dataTransfer.files]); });
  input.addEventListener('change', () => { pushFiles([...input.files]); input.value=''; });
  function pushFiles(files) {
    files.filter(f => /\.(pdf|docx)$/i.test(f.name)).forEach(f => {
      if (!st.files.find(x => x.name===f.name)) st.files.push({name:f.name,fileRef:f,bytes:null});
    });
    renderList();
  }
  function renderList() {
    list.innerHTML = st.files.map((f,i) => `
      <div class="file-chip">
        <span>${/\.docx$/i.test(f.name)?'📝':'📄'}</span>
        <span class="file-chip-name">${escapeHtml(f.name)}</span>
        <button class="file-chip-remove" data-i="${i}">×</button>
      </div>`).join('');
    list.querySelectorAll('.file-chip-remove').forEach(btn =>
      btn.addEventListener('click', () => { st.files.splice(+btn.dataset.i,1); renderList(); }));
  }

  const pricesBtn   = card.querySelector('.prices-toggle-btn');
  const pricesPanel = document.getElementById(`prices-panel-${id}`);
  pricesBtn.addEventListener('click', () => {
    const open = pricesPanel.style.display === 'none';
    pricesPanel.style.display = open ? 'block' : 'none';
    pricesBtn.textContent = (open ? '▾ ' : '+ ') + 'Свои пункты прайса';
    if (open) buildPricesPanel(id);
  });
}

async function calcBlock(card, id) {
  const st = serviceStates[id];
  if (!st?.files?.length) { setStatus('Добавьте хотя бы один файл.', true); return; }
  setStatus('Анализ...');
  try {
    const mode = document.getElementById(`sep-mode-${id}`).value;
    const copies = Math.max(1, parseInt(document.getElementById(`sep-copies-${id}`).value)||1);
    const allRows = [];
    for (const fe of st.files) {
      if (!fe.bytes) fe.bytes = new Uint8Array(await fe.fileRef.arrayBuffer());
      if (/\.docx$/i.test(fe.name)) allRows.push(...await analyzeWord(fe, mode, copies, id));
      else allRows.push(...await analyzePdf(fe, mode, copies, id));
    }
    const extra = (st.rows||[]).filter(r => r.isExtra);
    st.rows = [...allRows, ...extra];
    st.notes = [];
    rebuildRows();
    renderResult(card, id);
    updateTotal();
    setStatus('');
  } catch(e) { console.error(e); setStatus(e.message||'Ошибка.', true); }
}

async function analyzePdf(fe, mode, copies, blockId) {
  const pdf = await pdfjsLib.getDocument({data: fe.bytes.slice()}).promise;
  const groups = new Map();
  for (let i=1; i<=pdf.numPages; i++) {
    setProgress(blockId, i/pdf.numPages*100);
    setStatus(`${fe.name}: стр ${i}/${pdf.numPages}`);
    const page = await pdf.getPage(i);
    const vp = page.getViewport({scale:1});
    const wMm = ptToMm(vp.width), hMm = ptToMm(vp.height);
    const colorMode = mode==='auto' ? await detectColor(page) : mode;
    const detected  = detectFormat(wMm, hMm);
    const billed    = detected!=='CUSTOM' ? detected
                    : detectWideFormat(wMm,hMm) || findSmallestFitting(wMm,hMm) || findNearest(wMm,hMm);
    const actualLabel = `${Math.round(wMm*10)/10} × ${Math.round(hMm*10)/10} мм`;
    const key = `${fe.name}||${actualLabel}||${colorMode}||${billed}`;
    if (!groups.has(key)) groups.set(key, {fileName:fe.name,fileBytes:fe.bytes,actualLabel,colorMode,billed,pages:[],qty:0});
    const g = groups.get(key);
    g.pages.push(i);
    g.qty += copies;
  }
  setProgress(blockId, 0);
  return [...groups.values()].map(g => {
    const p = getSepPrice(g.billed, g.colorMode, g.qty);
    return {id:makeId(),blockId,fileName:g.fileName,fileBytes:g.fileBytes,actualLabel:g.actualLabel,
      colorMode:g.colorMode,billedFormat:g.billed,pages:g.pages,qty:g.qty,copies,
      unitPrice:p.price,tariffCode:p.code,tariffLabel:p.label,priceLocked:false,
      isExtra:false,isSeparator:true,priceSyncKey:`${g.colorMode}:${g.billed}`};
  });
}

async function analyzeWord(fe, mode, copies, blockId) {
  setStatus(`Анализ ${fe.name}...`);
  const result = await mammoth.extractRawText({arrayBuffer: fe.bytes.buffer});
  const pages  = Math.max(1, (result.value.match(/\f/g)||[]).length + 1);
  const colorMode = mode==='auto' ? 'bw' : mode;
  const qty = pages * copies;
  const p = getSepPrice('A4', colorMode, qty);
  return [{id:makeId(),blockId,fileName:fe.name,fileBytes:null,actualLabel:`Word, ~${pages} стр.`,
    colorMode,billedFormat:'A4',pages:Array.from({length:pages},(_,i)=>i+1),qty,copies,
    unitPrice:p.price,tariffCode:p.code,tariffLabel:p.label,priceLocked:false,
    isExtra:false,isSeparator:true,isWord:true}];
}

function getSepPrice(fmt, colorMode, qty) {
  const custom = CUSTOM_PRICES.find(c => c.format===fmt && c.colorMode===colorMode);
  if (custom) return {price:custom.price, code:custom.code, label:custom.label};

  if (colorMode==='bw' && PRICES.documentsBW[fmt]) {
    const t = PRICES.documentsBW[fmt].find(t => qty<=t.max) || PRICES.documentsBW[fmt].at(-1);
    return {price:t.price, code:t.code, label:t.label};
  }
  if (colorMode==='color' && PRICES.documentsColor[fmt]) {
    const i = PRICES.documentsColor[fmt];
    return {price:i.min, code:i.code, label:`${i.label} (от ${i.min}–${i.max} ₽)`};
  }
  if (PRICES.drawingsExact[colorMode]?.[fmt]) {
    const t = PRICES.drawingsExact[colorMode][fmt];
    return {price:t.price, code:t.code, label:`Широкоформатная печать ${colorMode==='color'?'цветн.':'ч/б'} ${fmt}`};
  }
  const wp = parseWideKey(fmt);
  if (wp) {
    const tbl = PRICES.drawingsWide[colorMode]?.[wp.base];
    if (tbl && tbl[wp.n]) return {price:tbl[wp.n], code:`wide-${colorMode}-${fmt}`,
      label:`Широкоформатная печать ${colorMode==='color'?'цветн.':'ч/б'} ${fmt}`};
    if (tbl) {
      const keys = Object.keys(tbl).map(Number).sort((a,b)=>a-b);
      const max  = keys.at(-1), prev = keys.at(-2)??max-1;
      const step = tbl[max]-tbl[prev];
      const extraPrice = tbl[max]+(wp.n-max)*step;
      return {price:extraPrice, code:`wide-${colorMode}-${fmt}+`,
        label:`Широкоформатная печать ${colorMode==='color'?'цветн.':'ч/б'} ${fmt} (продолжение прайса)`};
    }
  }
  return {price:0, code:'—', label:`Нет тарифа для ${fmt}`};
}

      <th style="text-align:center;padding:5px 6px;font-size:11px;color:var(--muted)">₽</th>

    CUSTOM_PRICES.forEach(c => {
      html += `<tr style="border-bottom:1px solid var(--line-soft)" data-cid="${c.id}">
        <td style="padding:5px 6px"><input class="pp-custom-code" value="${escapeHtml(c.code)}" style="width:70px;height:30px;padding:4px;border:1px solid var(--line);border-radius:6px;font-size:11px"></td>
        <td style="padding:5px 6px"><input class="pp-custom-label" value="${escapeHtml(c.label)}" style="width:100%;min-width:140px;height:30px;padding:4px;border:1px solid var(--line);border-radius:6px;font-size:11px"></td>
        <td style="padding:5px 6px"><input class="pp-custom-format" value="${escapeHtml(c.format)}" style="width:90px;height:30px;padding:4px;border:1px solid var(--line);border-radius:6px;font-size:11px;text-align:center"></td>
        <td style="padding:5px 6px;text-align:center">
          <select class="pp-custom-color" style="height:30px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;font-size:11px">
            <option value="bw" ${c.colorMode==='bw'?'selected':''}>ч/б</option>
            <option value="color" ${c.colorMode==='color'?'selected':''}>цвет</option>
          </select>
        </td>
        <td style="padding:5px 6px"><input type="number" class="pp-custom-price" value="${c.price}" min="0" step="0.1" style="width:70px;text-align:center;height:30px;padding:4px;border:1px solid var(--line);border-radius:6px;font-size:11px"></td>
        <td style="padding:5px 6px"><button class="pp-custom-del icon-btn" style="width:28px;height:28px;color:var(--danger);border-color:#f5c6c2;background:var(--danger-soft)">✕</button></td>
      </tr>`;
    });

  } else {

  }
  html += `<div style="margin-top:10px"><button type="button" class="btn-ghost btn-sm pp-add-custom">+ Добавить пункт прайса</button></div>`;
  html += `</div>`;

  function bindCustomRowInputs() {
    panel.querySelectorAll('[data-cid]').forEach(tr => {
      const cid = tr.dataset.cid;
      const entry = CUSTOM_PRICES.find(c => c.id===cid);

      tr.querySelector('.pp-custom-code').addEventListener('input', e => entry.code = e.target.value);

// ── RESULT RENDER ──────────────────────────────────────────────────
function renderResult(card, id) {
  const st = serviceStates[id];
  const resultEl = document.getElementById(`result-${id}`);
  const bodyEl   = document.getElementById(`result-body-${id}`);
  const subtotalEl = document.getElementById(`result-subtotal-${id}`);
  if (!st.rows?.length) { resultEl.classList.remove('visible'); return; }
  resultEl.classList.add('visible');
  bodyEl.classList.toggle('collapsed', !!st.collapsed);
  document.getElementById(`result-chevron-${id}`).classList.toggle('open', !st.collapsed);
  const sub = st.rows.reduce((s,r) => s+r.qty*r.unitPrice, 0);
  subtotalEl.textContent = money(sub);
  const sepRows = st.rows.filter(r => r.isSeparator && !r.isWord);
  let html = '';
  if (sepRows.length) {
    html += `<div class="download-actions">
      <button type="button" class="btn-secondary btn-sm dl-all-btn" data-id="${id}">⬇ Скачать всё (ZIP)</button>
      <button type="button" class="btn-secondary btn-sm merge-btn" data-id="${id}">⊞ Объединить строки</button>
      <button type="button" class="btn-ghost btn-sm add-row-btn" data-id="${id}">+ Добавить строку</button>
    </div>`;
  }
  html += `<div class="table-wrap"><table>
    <thead><tr>
      <th>Тариф</th><th>Размер в файле</th>
      <th style="min-width:140px">Формат печати</th>
      <th>Кол-во</th><th>Цена/ед.</th><th>Сумма</th><th></th>
    </tr></thead>
    <tbody>${st.rows.map(renderRowHtml).join('')}</tbody>
  </table></div>`;
  bodyEl.innerHTML = html;
  bindResultEvents(bodyEl, card, id);
}

function renderRowHtml(row) {
  const sum = row.qty * row.unitPrice;
  const customFmts = [...new Set(CUSTOM_PRICES.map(c => c.format))].filter(f => !ALL_FORMATS.includes(f));
  const fmtOptions = [...ALL_FORMATS, ...customFmts];
  const fmtCell = row.isSeparator ? `
    <select class="row-format-select" data-row-id="${row.id}" style="height:36px;padding:6px 10px;font-size:13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:inherit;min-width:120px;">
      ${fmtOptions.map(f => `<option value="${f}" ${f===row.billedFormat?'selected':''}>${escapeHtml(fmtLabel(f))}</option>`).join('')}
    </select>` : escapeHtml(row.billedFormat||'—');
  const dlBtn = row.isSeparator && !row.isWord && row.fileBytes
    ? `<button type="button" class="btn-secondary btn-xs dl-row-btn" data-row-id="${row.id}">⬇ PDF</button>` : '';
  const removeBtn = row.isExtra
    ? `<button type="button" class="icon-btn remove-extra" data-row-id="${row.id}" title="Удалить">✕</button>` : '';
  // Color-mode correction: lets you fix a misdetected row (e.g. scanner missed
  // a color signature on a page marked bw) — flips colorMode and re-pulls the
  // correct tariff/price for the row's current format+qty.
  const colorToggle = (row.isSeparator && row.colorMode)
    ? `<button type="button" class="row-color-toggle" data-row-id="${row.id}"
         style="margin-top:6px;font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:${row.colorMode==='color'?'#fdf0ef':'#f7f7f5'};color:${row.colorMode==='color'?'#c0392b':'#444'};cursor:pointer;font-weight:600"
         title="Нажмите, чтобы исправить цветность и пересчитать тариф">
         ${row.colorMode==='color'?'🎨 цветная':'⚫ ч/б'} — исправить
       </button>` : '';
  return `<tr data-row-id="${row.id}">
    <td style="text-align:left">
      <div class="cell-code">${escapeHtml(row.tariffCode||'—')}</div>
      <div class="cell-label">${escapeHtml(row.tariffLabel||'—')}</div>
      ${dlBtn}

function updateTariffCell(tr, row) {
  if (!tr) return;
  const cc = tr.querySelector('.cell-code'); if (cc) cc.textContent = row.tariffCode||'—';
  const cl = tr.querySelector('.cell-label'); if (cl) cl.textContent = row.tariffLabel||'—';
}
function updateRowSum(rowId) {
  const row = calculatedRows.find(r => r.id===rowId);
  const cell = document.querySelector(`.sum-cell[data-row-id="${rowId}"]`);
  if (row && cell) cell.textContent = money(row.qty*row.unitPrice);
}
function updateSubtotal(id) {
  const st = serviceStates[id];
  const sub = (st?.rows||[]).reduce((s,r)=>s+r.qty*r.unitPrice,0);
  const el = document.getElementById(`result-subtotal-${id}`);
  if (el) el.textContent = money(sub);
}
function syncRows(id) {
  const st = serviceStates[id];
  if (!st) return;
  st.rows = st.rows.map(r => calculatedRows.find(c=>c.id===r.id)||r);
}
function mergeRows(st, card, id) {
  const sep = st.rows.filter(r => r.isSeparator);
  const other = st.rows.filter(r => !r.isSeparator);
  const groups = new Map();
  for (const r of sep) {
    const k = `${r.billedFormat}||${r.colorMode||''}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  const merged = [];
  for (const [,rows] of groups) {
    if (rows.length===1) { merged.push(rows[0]); continue; }
    const base = {...rows[0], id:makeId()};
    base.qty = rows.reduce((s,r)=>s+r.qty,0);
    base.pages = rows.flatMap(r=>r.pages||[]).sort((a,b)=>a-b);
    base.actualLabel = rows.map(r=>r.actualLabel).join(', ');
    if (!base.priceLocked) {
      const p = getSepPrice(base.billedFormat, base.colorMode, base.qty);
      Object.assign(base, {unitPrice:p.price, tariffCode:p.code, tariffLabel:p.label});
    }
    merged.push(base);
  }
  st.rows = [...merged, ...other];
  rebuildRows(); renderResult(card,id); updateTotal();
}

// ── DOWNLOAD ───────────────────────────────────────────────────────
function colorLabel(m) { return m==='color'?'цвет':'чб'; }
function buildFileName(billedFormat, colorMode, pages, fileName) {
  const pg = compressRanges(pages).replace(/,\s*/g,'_');
  const base = fileName ? '_'+sanitize(fileName.replace(/\.(pdf|docx)$/i,'')) : '';
  return `${sanitize(billedFormat)}_${colorLabel(colorMode)}${base}_стр${pg}.pdf`;
}
async function downloadRowPdf(row) {
  if (!row.fileBytes || !row.pages?.length) { setStatus('Нет данных.', true); return; }
  try {
    setStatus('Создаю PDF...');
    const bytes = await buildPdf(row.fileBytes, row.pages);
    downloadBytes(bytes, buildFileName(row.billedFormat, row.colorMode, row.pages, row.fileName), 'application/pdf');
    setStatus('Файл скачан.');
  } catch(e) { setStatus('Ошибка PDF.', true); }
}
async function downloadAll(id) {
  const st = serviceStates[id];
  const rows = (st?.rows||[]).filter(r => r.isSeparator && !r.isWord && r.fileBytes && r.pages?.length);
  if (!rows.length) { setStatus('Нет файлов.', true); return; }
  setStatus('Собираю архив...');
  try {
    const zip = new JSZip();
    const groups = new Map();
    for (const r of rows) {
      const k = `${r.fileName||''}||${r.billedFormat}||${r.colorMode||'bw'}`;
      if (!groups.has(k)) groups.set(k, {billedFormat:r.billedFormat,colorMode:r.colorMode||'bw',fileName:r.fileName,fileBytes:r.fileBytes,pages:[]});
      groups.get(k).pages.push(...r.pages);
    }
    const used = new Set();
    for (const g of groups.values()) {
      const pages = [...new Set(g.pages)].sort((a,b)=>a-b);
      const bytes = await buildPdf(g.fileBytes, pages);
      let name = buildFileName(g.billedFormat, g.colorMode, pages, g.fileName);
      if (used.has(name)) name = name.replace('.pdf', `_${makeId().slice(0,4)}.pdf`);
      used.add(name);
      zip.file(name, bytes);
    }
    const blob = await zip.generateAsync({type:'blob'});
    const card = document.querySelector(`.service-card[data-id="${id}"]`);
    const svcName = card?.querySelector('.card-name-input')?.value?.trim() || `разделитель_${id}`;
    downloadBytes(blob, `${sanitize(svcName)}.zip`, 'application/zip');
    setStatus(`Архив скачан: ${groups.size} файл(ов).`);
  } catch(e) { console.error(e); setStatus('Ошибка архива.', true); }
}
async function buildPdf(srcBytes, pages) {
  const src = await PDFDocument.load(srcBytes.slice());
  const out  = await PDFDocument.create();
  const cp   = await out.copyPages(src, pages.map(p=>p-1));
  cp.forEach(p => out.addPage(p));
  return out.save();
}
function downloadBytes(data, name, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], {type:mime});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=name; a.style.display='none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

          <input type="number" id="g-custom-h-${id}" min="1" step="0.1" value="150">
        </div>
        <div></div>
      </div>
      <div class="grid-3">
        <div class="field"><label>Отступ снизу (y), мм — портретная фаза</label>
          <input type="number" id="g-y-${id}" min="0" step="0.1" value="8.5">
        </div>
        <div class="field"><label>Отступ слева (x), мм — альбомная фаза</label>
          <input type="number" id="g-x-${id}" min="0" step="0.1" value="8.5">
        </div>
        <div id="g-info-${id}" style="font-size:13px;color:var(--muted);padding-top:8px"></div>
      </div>
      <div>
        <button type="button" class="g-advanced-toggle" id="g-adv-btn-${id}">▸ Дополнительные параметры</button>
        <div id="g-adv-${id}" style="display:none;margin-top:12px">
          <div class="grid-3">
            <div class="field"><label>Мин. рез, мм</label><input type="number" id="g-mincut-${id}" min="0" step="0.1" value="50"></div>
            <div class="field"><label>Зазор между макетами, мм</label><input type="number" id="g-gap-${id}" min="0" step="0.1" value="4"></div>
            <div class="field"><label>Брусок на упоре, мм</label><input type="number" id="g-block-${id}" min="0" step="0.1" value="6.5"></div>
          </div>
        </div>
      </div>
      <div><button type="button" class="btn-primary" id="g-calc-${id}">Рассчитать инструкцию</button></div>
      <div id="g-result-${id}"></div>
    </div>`;

  const bestOrientation = (src, tgt, gap) => {
    const fit = (sheetDim, itemDim) => itemDim > 0 ? Math.max(0, Math.floor((sheetDim + gap) / (itemDim + gap))) : 0;
    const optA = { dimH: tgt.fw, dimW: tgt.fh, n1: fit(src.h, tgt.fw), n2: fit(src.w, tgt.fh) };
    const optB = { dimH: tgt.fh, dimW: tgt.fw, n1: fit(src.h, tgt.fh), n2: fit(src.w, tgt.fw) };
    return (optB.n1 * optB.n2 > optA.n1 * optA.n2) ? optB : optA;
  };

  const getTarget = () => {
    const tgtKey = document.getElementById(`g-tgt-${id}`).value;
    if (tgtKey === 'custom') {
      const w = parseFloat(document.getElementById(`g-custom-w-${id}`)?.value) || 0;
      const h = parseFloat(document.getElementById(`g-custom-h-${id}`)?.value) || 0;
      return { key:'custom', label:`Произвольный (${fmt2(w)}×${fmt2(h)})`, fw:w, fh:h };
    }
    return GUILL_TARGETS.find(t=>t.key===tgtKey);
  };

  const updateCustomVis = () => {
    const isCustom = document.getElementById(`g-tgt-${id}`).value === 'custom';
    document.getElementById(`g-custom-wrap-${id}`).style.display = isCustom ? 'grid' : 'none';
  };

  const updateInfo = () => {
    const src  = GUILL_SOURCES[document.getElementById(`g-src-${id}`).value];
    const tgt  = getTarget();
    const gap  = parseFloat(document.getElementById(`g-gap-${id}`)?.value) || 4;
    const best = bestOrientation(src, tgt, gap);
    const total = best.n1 * best.n2;
    document.getElementById(`g-info-${id}`).innerHTML = total > 0
      ? `На листе: <strong>${total} шт</strong> (${best.n1}×${best.n2})`
      : `<span style="color:var(--danger)">Формат не помещается</span>`;
  };

  document.getElementById(`g-src-${id}`).addEventListener('change', updateInfo);
  document.getElementById(`g-tgt-${id}`).addEventListener('change', () => { updateCustomVis(); updateInfo(); });
  document.getElementById(`g-custom-w-${id}`).addEventListener('input', updateInfo);
  document.getElementById(`g-custom-h-${id}`).addEventListener('input', updateInfo);
  document.getElementById(`g-gap-${id}`)?.addEventListener('input', updateInfo);
  document.getElementById(`g-adv-btn-${id}`).addEventListener('click', () => {
    const adv = document.getElementById(`g-adv-${id}`);
    const btn = document.getElementById(`g-adv-btn-${id}`);
    const open = adv.style.display==='none';
    adv.style.display = open ? 'block' : 'none';
    btn.textContent = (open?'▾ ':'▸ ')+'Дополнительные параметры';
  });
  document.getElementById(`g-calc-${id}`).addEventListener('click', () => calcGuillotine(id));
  updateCustomVis();
  updateInfo();
}

// Reads the currently selected target format, building a synthetic one from
// the custom-size fields when "произвольный формат" is selected.
function guillGetTarget(id) {
  const tgtKey = document.getElementById(`g-tgt-${id}`).value;
  if (tgtKey === 'custom') {
    const w = parseFloat(document.getElementById(`g-custom-w-${id}`)?.value) || 0;
    const h = parseFloat(document.getElementById(`g-custom-h-${id}`)?.value) || 0;
    return { key:'custom', label:`Произвольный (${fmt2(w)}×${fmt2(h)})`, fw:w, fh:h };
  }
  return GUILL_TARGETS.find(t=>t.key===tgtKey);
}

// Renders the rotated-"A" orientation icon used to show which way the sheet is fed
function gOrientIcon(deg) {
  return `<div class="g-orient" style="transform:rotate(${deg}deg)">A</div>`;
}

function calcGuillotine(id) {
  const srcKey = document.getElementById(`g-src-${id}`).value;
  const src    = GUILL_SOURCES[srcKey];
  const tgt    = guillGetTarget(id);
  const y      = parseFloat(document.getElementById(`g-y-${id}`).value)||0;
  const x      = parseFloat(document.getElementById(`g-x-${id}`).value)||0;
  const minCut = parseFloat(document.getElementById(`g-mincut-${id}`)?.value)||50;
  const gap    = parseFloat(document.getElementById(`g-gap-${id}`)?.value)||4;
  const block  = parseFloat(document.getElementById(`g-block-${id}`)?.value)||6.5;
  const resultEl = document.getElementById(`g-result-${id}`);

  if (!tgt.fw || !tgt.fh) {
    resultEl.innerHTML = `<div class="g-warn" style="margin-top:14px">⚠️ Укажите ширину и высоту произвольного формата.</div>`;
    return;
  }

  if (src.w === tgt.fw && src.h === tgt.fh) {
    resultEl.innerHTML = `<div class="g-warn" style="margin-top:14px">⚠️ Исходный и итоговый формат совпадают — резать нечего.</div>`;
    return;
  }

  // ── Choose orientation that yields the most pieces ──────────────
  // Try both ways of mapping the target's two dimensions onto the sheet's
  // height axis (portrait phase) and width axis (landscape phase).
  function fitCount(sheetDim, itemDim) {
    if (itemDim <= 0) return 0;
    return Math.max(0, Math.floor((sheetDim + gap) / (itemDim + gap)));
  }
  const optA = { dimH: tgt.fw, dimW: tgt.fh, n1: fitCount(src.h, tgt.fw), n2: fitCount(src.w, tgt.fh) };
  const optB = { dimH: tgt.fh, dimW: tgt.fw, n1: fitCount(src.h, tgt.fh), n2: fitCount(src.w, tgt.fw) };
  const best = (optB.n1 * optB.n2 > optA.n1 * optA.n2) ? optB : optA;

  if (best.n1 < 1 || best.n2 < 1) {
    resultEl.innerHTML = `<div class="g-warn" style="margin-top:14px">⚠️ Формат ${escapeHtml(tgt.label)} не помещается на листе ${escapeHtml(src.label)}.</div>`;
    return;
  }

  // ── Core chain builder for one axis ──────────────────────────────
  // The stop is glued with a permanent block, so every dial value already
  // includes it. Block is added ONCE at the very start of the axis; every
  // following cut on the SAME (unflipped) side is just the previous dial
  // value minus the real mm removed — the +block offset cancels through
  // automatically. Only the final flip (approaching from the other edge)
  // needs the block re-added, which is why that step is always the fixed
  // constant itemDim + block, independent of whatever margin is left.
  function axisChain(sheetDim, itemDim, marginInput, N) {
    const steps = [];
    let dial = sheetDim + block - marginInput;
    steps.push({
      kind: 'margin',
      action: `Обрезка стартового поля (${fmt2(marginInput)} мм)`,
      dial,
      formula: `${fmt2(sheetDim)} + ${fmt2(block)} − ${fmt2(marginInput)} = ${fmt2(dial)}`,
      removed: marginInput
    });

    for (let k = 1; k <= N - 1; k++) {
      dial -= itemDim;
      steps.push({
        kind: 'item',
        action: `Деталь ${k} из ${N}`,
        dial,
        formula: `− ${fmt2(itemDim)} мм (размер детали) = ${fmt2(dial)}`,
        removed: itemDim
      });

      if (gap > 0.001) {
        dial -= gap;
        steps.push({
          kind: 'gap',
          action: `Зазор`,
          dial,
          formula: `− ${fmt2(gap)} мм (зазор) = ${fmt2(dial)}`,
          removed: gap
        });
      }
    }

    // Physical piece remaining before the flip = dial - block.
    // The flip-trim always removes exactly itemDim from that, whatever's
    // left (the trailing margin) falls away — no need to know its size.
    const physBefore = dial - block;
    const trailingMargin = physBefore - itemDim;
    const finalDial = itemDim + block;
    steps.push({
      kind: 'flip',
      action: `Деталь ${N} из ${N} — последняя (после переворота)`,
      dial: finalDial,
      formula: `${fmt2(itemDim)} + ${fmt2(block)} = ${fmt2(finalDial)} (фиксированное значение)`,
      removed: trailingMargin > 0.05 ? trailingMargin : null,
      flip: true
    });

    return steps;
  }

  const hSteps = axisChain(src.h, best.dimH, y, best.n1);
  const vSteps = axisChain(src.w, best.dimW, x, best.n2);

  const totalPieces = best.n1 * best.n2;
  const totalSteps   = hSteps.length + vSteps.length;

  // ── Render ────────────────────────────────────────────────────────
  let html = `<div style="margin-top:16px">
    <div class="g-summary">
      ${escapeHtml(src.label)} → <strong>${totalPieces} шт</strong> ${escapeHtml(tgt.label)}
      (${best.n1}×${best.n2}). Брусок ${fmt2(block)} мм. Итого <strong>${totalSteps} резов</strong>.
    </div>`;

  let stepNum = 0;

  function renderStepGroup(steps, phaseDeg, phaseTitle, phaseSub) {
    // Split into "normal" steps and the final flip step
    const normalSteps = steps.filter(s => !s.flip);
    const flipStep     = steps.find(s => s.flip);

    let out = `<div class="g-phase-head">
      ${gOrientIcon(phaseDeg)}
      <div>
        <div class="g-phase-head-text">${escapeHtml(phaseTitle)}</div>
        <div class="g-phase-head-sub">${escapeHtml(phaseSub)}</div>
      </div>
    </div>`;

    for (const s of normalSteps) out += renderGStep(++stepNum, s);

    if (flipStep) {
      const flipDeg = phaseDeg === 0 ? 180 : (phaseDeg === -90 ? 90 : phaseDeg);
      out += `<div class="g-phase-head" style="margin-top:14px">
        ${gOrientIcon(flipDeg)}
        <div>
          <div class="g-phase-head-text">Переворот листа</div>
          <div class="g-phase-head-sub">Подайте лист другой стороной к упору для финального реза</div>
        </div>
      </div>`;
      out += renderGStep(++stepNum, flipStep);
    }

    return out;
  }

  html += renderStepGroup(
    hSteps, 0,
    'ФАЗА 1 — Портретная ориентация',
    `Лист как обычно, рез всегда снизу. Получаем ${best.n1} полос(ы) шириной ${fmt2(best.dimH)} мм.`
  );

  html += renderStepGroup(
    vSteps, -90,
    'ФАЗА 2 — Альбомная ориентация (повторить для каждой полосы)',
    `Лист повёрнут на 90° против часовой. Каждую из ${best.n1} полос делим на ${best.n2} детали(ей) по ${fmt2(best.dimW)} мм.`
  );

  html += `</div>`;
  resultEl.innerHTML = html;

  resultEl.querySelectorAll('.g-step-check').forEach(label => {
    label.addEventListener('click', () => {
      const cb = label.querySelector('.g-cb');
      cb.checked = !cb.checked;
      const el = document.getElementById(cb.dataset.sid);
      if (el) el.classList.toggle('g-step-done', cb.checked);
      const num = label.querySelector('.g-step-num');
      if (num) num.textContent = cb.checked ? '✓' : el?.dataset.num||'';
    });
  });

  // ── Local render helper (closure captures id + minCut) ──────────
  function renderGStep(stepNum, s) {
    const sid = `gs-${id}-${stepNum}`;
    const tooSmall = s.dial < minCut - 0.05;
    return `<div class="g-step" id="${sid}" data-num="${stepNum}">
      <label class="g-step-check" title="Отметить выполнено">
        <input type="checkbox" class="g-cb" data-sid="${sid}" style="display:none">
        <div class="g-step-num">${stepNum}</div>
      </label>
      <div class="g-step-body">
        <div class="g-step-action">${escapeHtml(s.action)}</div>
        <div class="g-dial-primary">${fmt2(s.dial)} мм</div>
        <div class="g-dial-sub">${escapeHtml(s.formula)}</div>
        ${s.removed != null ? `<div class="g-val-chip" style="margin-top:8px;font-size:11px;color:var(--muted)">в отход: ${fmt2(s.removed)} мм</div>` : ''}
        ${tooSmall ? `<div style="margin-top:7px;padding:7px 11px;background:var(--danger-soft);border:1px solid #f5c6c2;border-radius:7px;font-size:12px;color:var(--danger)">🚫 Значение ${fmt2(s.dial)} мм меньше минимального реза (${fmt2(minCut)} мм)</div>` : ''}
      </div>
    </div>`;
  }
}


// ── CONVERTER ──────────────────────────────────────────────────────
function renderConverterBody(id) { return `<div id="conv-ui-${id}"></div>`; }

function initConverter(card, id) {
  const root = document.getElementById(`conv-ui-${id}`);
  if (!root) return;
  if (!window._heic2anyLoaded) {
    window._heic2anyLoaded = true;
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js';
    document.head.appendChild(s);
  }
  const files = serviceStates[id].files;
  root.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="field">
        <label>Файлы (PDF, JPG, PNG, WEBP, HEIC, DOCX)</label>
        <div class="file-upload-area" id="cv-area-${id}" style="cursor:pointer">
          <div class="file-upload-icon">🔄</div>
          <div class="file-upload-label">Нажмите или перетащите файлы</div>
          <div class="file-upload-hint">PDF, JPG, PNG, WEBP, HEIC, DOCX и другие</div>
        </div>
        <input type="file" id="cv-inp-${id}" accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,.bmp,.tiff,.tif,.docx" multiple style="display:none">
        <div id="cv-list-${id}" class="file-list"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Конвертировать в</label>
          <select id="cv-tgt-${id}" style="height:42px">
            <option value="pdf">PDF</option>
            <option value="jpg">JPG</option>
            <option value="png">PNG</option>
            <option value="webp">WEBP</option>
          </select>
        </div>
        <div class="field" id="cv-qwrap-${id}">
          <label>Качество JPG/WEBP (0.1–1)</label>
          <input type="number" id="cv-q-${id}" min="0.1" max="1" step="0.05" value="0.92">
        </div>
      </div>
      <div><button type="button" class="btn-primary" id="cv-go-${id}">Конвертировать</button></div>
      <div id="cv-links-${id}" style="display:flex;flex-wrap:wrap;gap:10px"></div>
      <div id="cv-log-${id}" style="font-size:13px;color:var(--muted)"></div>
    </div>`;

  const area   = document.getElementById(`cv-area-${id}`);
  const input  = document.getElementById(`cv-inp-${id}`);
  const listEl = document.getElementById(`cv-list-${id}`);
  const tgtSel = document.getElementById(`cv-tgt-${id}`);
  const qWrap  = document.getElementById(`cv-qwrap-${id}`);
  const logEl  = document.getElementById(`cv-log-${id}`);
  const goBtn  = document.getElementById(`cv-go-${id}`);
  const linksEl= document.getElementById(`cv-links-${id}`);

  tgtSel.addEventListener('change', () => { qWrap.style.display = ['jpg','webp'].includes(tgtSel.value)?'':'none'; });
  qWrap.style.display = 'none';

  area.addEventListener('click', () => input.click());
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => { e.preventDefault(); area.classList.remove('dragover'); push([...e.dataTransfer.files]); });
  input.addEventListener('change', () => { push([...input.files]); input.value=''; });

  function push(fs) {
    fs.forEach(f => { if (!files.find(x=>x.name===f.name)) files.push(f); });
    renderList();
  }
  function renderList() {
    const icons = {pdf:'📄',docx:'📝',jpg:'🖼',jpeg:'🖼',png:'🖼',webp:'🖼',heic:'🖼',heif:'🖼',bmp:'🖼',tiff:'🖼',tif:'🖼'};
    listEl.innerHTML = files.map((f,i) => {
      const ext = (f.name.split('.').pop()||'').toLowerCase();
      return `<div class="file-chip">
        <span>${icons[ext]||'📎'}</span>
        <span class="file-chip-name">${escapeHtml(f.name)}</span>
        <button class="file-chip-remove" data-i="${i}" style="background:none;border:none;cursor:pointer;font-size:16px;padding:0 2px">×</button>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.file-chip-remove').forEach(btn =>
      btn.addEventListener('click', () => { files.splice(+btn.dataset.i,1); renderList(); }));
  }

  goBtn.addEventListener('click', async () => {
    if (!files.length) { logEl.textContent='Добавьте файлы.'; return; }
    const fmt  = tgtSel.value;
    const qual = Math.min(1,Math.max(0.1,parseFloat(document.getElementById(`cv-q-${id}`).value)||0.92));
    linksEl.innerHTML=''; logEl.textContent=''; goBtn.disabled=true;
    for (const f of files) {
      logEl.textContent = `Обрабатываю: ${f.name}…`;
      try {
        const res = await convertFile(f, fmt, qual);
        const a = document.createElement('a');
        a.href=res.url; a.download=res.name;
        a.style.cssText='display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;text-decoration:none;color:var(--text);cursor:pointer';
        a.innerHTML=`⬇ ${escapeHtml(res.name)}`;
        linksEl.appendChild(a);
      } catch(err) {
        const d = document.createElement('div');
        d.style.cssText='padding:8px 12px;background:var(--danger-soft);border:1px solid #f5c6c2;border-radius:8px;font-size:13px;color:var(--danger)';
        d.textContent=`${f.name}: ${err.message}`;
        linksEl.appendChild(d);
      }
    }
    logEl.textContent='Готово.'; goBtn.disabled=false;
  });
}

function toBlob(canvas, mime, q) {
  return new Promise((res,rej) => canvas.toBlob(b=>b?res(b):rej(new Error('toBlob failed')), mime, q));
}
function loadImg(file) {
  return new Promise((res,rej) => {
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);res(img);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не удалось открыть изображение'));};
    img.src=url;
  });
}
async function imgToCanvas(file) {
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if (['heic','heif'].includes(ext)) {
    if (typeof heic2any==='undefined') throw new Error('heic2any загружается, повторите через секунду');
    const blob = await heic2any({blob:file,toType:'image/png'});
    const png  = new File([blob], file.name.replace(/\.[^.]+$/,'.png'),{type:'image/png'});
    const img  = await loadImg(png);
    const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
    c.getContext('2d').drawImage(img,0,0); return c;
  }
  const img=await loadImg(file);
  const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0); return c;
}
async function convertFile(file, fmt, qual) {
  const ext  = (file.name.split('.').pop()||'').toLowerCase();
  const stem = file.name.slice(0,file.name.lastIndexOf('.'));
  const imgExts = ['jpg','jpeg','png','webp','heic','heif','bmp','tiff','tif'];

  if (imgExts.includes(ext)) {
    const canvas = await imgToCanvas(file);
    if (fmt==='pdf') {
      if (!PDFDocument) throw new Error('PDF-lib не загружен');
      const pngBlob = await toBlob(canvas,'image/png',1);
      const pngBytes= new Uint8Array(await pngBlob.arrayBuffer());
      const doc=await PDFDocument.create(), img=await doc.embedPng(pngBytes);
      const page=doc.addPage([img.width,img.height]);
      page.drawImage(img,{x:0,y:0,width:img.width,height:img.height});
      const bytes=await doc.save();
      return {url:URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),name:`${stem}.pdf`};
    }
    const mimes={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'};
    const blob=await toBlob(canvas,mimes[fmt]||'image/png',qual);
    return {url:URL.createObjectURL(blob),name:`${stem}.${fmt}`};
  }

  if (ext==='pdf' && fmt!=='pdf') {
    if (!pdfjsLib) throw new Error('PDF.js не загружен');
    const bytes=new Uint8Array(await file.arrayBuffer());
    const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
    const mimes={jpg:'image/jpeg',png:'image/png',webp:'image/webp'};
    const mime=mimes[fmt]||'image/png';
    const render=async(n) => {
      const pg=await pdf.getPage(n), vp=pg.getViewport({scale:2});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      return toBlob(c,mime,qual);
    };
    if (pdf.numPages===1) {
      const blob=await render(1);
      return {url:URL.createObjectURL(blob),name:`${stem}.${fmt}`};
    }
    const zip=new JSZip();
    for (let i=1;i<=pdf.numPages;i++) {
      const blob=await render(i);
      zip.file(`${stem}_стр${i}.${fmt}`,await blob.arrayBuffer());
    }
    const zblob=await zip.generateAsync({type:'blob'});
    return {url:URL.createObjectURL(zblob),name:`${stem}_страницы.zip`};
  }

  if (ext==='docx') {
    if (typeof mammoth==='undefined') throw new Error('Mammoth не загружен');
    const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;margin:40px;line-height:1.6;max-width:800px}</style></head><body>${r.value}</body></html>`;
    return {url:URL.createObjectURL(new Blob([html],{type:'text/html'})),name:`${stem}.html`};
  }
  throw new Error(`Конвертация .${ext}→${fmt.toUpperCase()} не поддерживается`);
}

// ── GLOBAL HELPERS ─────────────────────────────────────────────────
async function calcAll() {
  const cards = [...document.querySelectorAll('.service-card')];
  for (const c of cards) if (c.dataset.type==='separator') await calcBlock(c, +c.dataset.id);
}
function clearAll() {
  container.innerHTML=''; blockCounter=1; calculatedRows=[];
  Object.keys(serviceStates).forEach(k=>delete serviceStates[k]);
  totalBlock.classList.remove('visible');
  setStatus('');
  addBlock('separator');
}
function rebuildRows() {
  calculatedRows=[];
  Object.values(serviceStates).forEach(st => { if (st.rows) calculatedRows.push(...st.rows); });
}
function updateTotal() {
  let total = calculatedRows.reduce((s,r)=>s+r.qty*r.unitPrice, 0);
  Object.values(serviceStates).forEach(st => {
    if (st.type==='folding' && st.foldLines) {
      st.foldLines.forEach(l => {
        const t=FOLD_PRICES[l.direction]; if (!t) return;
        const ba=FOLD_DIRECTION_OPTS.find(d=>d.key===l.direction)?.baseArea||1;
        let fa=FMT_AREA[l.format]||1;
        const m=/^([A][234])x(\d+)$/i.exec(l.format);
        if (m) fa=(FMT_AREA[m[1].toUpperCase()]||1)*Number(m[2]);
        const price=l.direction==='custom-A4'?t.price:Math.round(t.price*(fa/ba)*100)/100;
        total+=price*l.qty;
      });
    }
    if (st.type==='binding' && st.bindingLines) {
      st.bindingLines.forEach(l => {
        const opt=BINDING_OPTIONS.find(o=>o.key===l.key); if (!opt) return;
        const price=opt.tiers?(opt.tiers.find(t=>l.sheets<=t.max)||opt.tiers.at(-1)).price:opt.price;
        total+=price*l.copies;
      });
    }
  });
  const hasAny = calculatedRows.length>0 ||
    Object.values(serviceStates).some(st=>
      (st.type==='folding'&&st.foldLines?.length)||
      (st.type==='binding'&&st.bindingLines?.length));
  if (hasAny) { totalBlock.classList.add('visible'); totalAmountEl.textContent=money(total); }
  else totalBlock.classList.remove('visible');
}
function setStatus(text, isError=false) {
  statusEl.style.display = text ? 'flex' : 'none';
  statusEl.textContent = text||'';
  statusEl.className = 'status-pill'+(isError?' error':'');
}
function setProgress(id, pct) {
  const w=document.getElementById(`progress-wrap-${id}`);
  const b=document.getElementById(`progress-bar-${id}`);
  if (!w||!b) return;
  if (pct>0&&pct<100) { w.classList.add('visible'); b.style.width=pct+'%'; }
  else { w.classList.remove('visible'); b.style.width='0%'; }
}

// ── FORMAT DETECTION ───────────────────────────────────────────────
function detectFormat(w, h) {
  for (const [name, size] of Object.entries(FORMATS)) {
    const n=Math.abs(w-size.w)<=TOLERANCE_MM&&Math.abs(h-size.h)<=TOLERANCE_MM;
    const r=Math.abs(w-size.h)<=TOLERANCE_MM&&Math.abs(h-size.w)<=TOLERANCE_MM;
    if (n||r) return name;
  }
  return 'CUSTOM';
}
function detectWideFormat(w, h) {
  // A4xN: width=210*N, height=297. step=210, constant=297.
  const bases = ['A4','A3','A2','A1'];
  let best=null, bestScore=Infinity;
  for (const base of bases) {
    const s=FORMATS[base];
    const step=s.w, con=s.h;
    for (const [pageStep,pageConst] of [[Math.max(w,h),Math.min(w,h)],[Math.min(w,h),Math.max(w,h)]]) {
      const constDiff=Math.abs(pageConst-con);
      if (constDiff>20) continue;
      const rawN=pageStep/step;
      for (const n of [Math.floor(rawN),Math.round(rawN),Math.ceil(rawN)]) {
        if (n<2||n>20) continue;
        const stepDiff=Math.abs(pageStep-step*n);
        if (stepDiff>Math.max(25, n*4)) continue;
        const score=constDiff*3+stepDiff;
        if (score<bestScore) { bestScore=score; best=`${base}x${n}`; }
      }
    }
  }
  return best;
}
function findSmallestFitting(w, h) {
  const short = Math.min(w, h), long = Math.max(w, h);
  const pageRatio = long / short;
  // Every standard A-series sheet shares the same ratio (~1.414). A page whose
  // ratio is far beyond that is an elongated multi-panel strip (A4x3 etc.),
  // not a genuine oversized standard sheet — even if it happens to fit inside
  // one's bounding box. Reject those so they don't get mislabeled (e.g. a
  // 630×297mm A4x3 strip technically fits inside A1's 594×841 box, but its
  // shape has nothing to do with A1).
  if (pageRatio > Math.SQRT2 * 1.3) return null;
  for (const name of ['A6','A5','A4','A3','A2','A1','A0']) {
    const s=FORMATS[name], fs=Math.min(s.w,s.h), fl=Math.max(s.w,s.h);
    if (short<=fs+TOLERANCE_MM&&long<=fl+TOLERANCE_MM) return name;
  }
  return null;
}
function findNearest(w, h) {
  let best='A4', bestDist=Infinity;
  Object.entries(FORMATS).forEach(([name,size]) => {
    const d=Math.min(Math.abs(w-size.w)+Math.abs(h-size.h),Math.abs(w-size.h)+Math.abs(h-size.w));
    if (d<bestDist) { bestDist=d; best=name; }
  });
  return best;
}

// ── COLOR DETECTION ────────────────────────────────────────────────
async function detectColor(page) {
  const vp=page.getViewport({scale:0.5});
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  canvas.width=Math.max(1,Math.floor(vp.width));
  canvas.height=Math.max(1,Math.floor(vp.height));
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  const {data,width,height}=ctx.getImageData(0,0,canvas.width,canvas.height);
  let colorPx=0;
  for (let y=0;y<height;y+=SAMPLE_STEP) {
    for (let x=0;x<width;x+=SAMPLE_STEP) {
      const i=(y*width+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if (a<10) continue;
      if (Math.abs(r-g)>COLOR_TOLERANCE||Math.abs(g-b)>COLOR_TOLERANCE||Math.abs(r-b)>COLOR_TOLERANCE)
        if (++colorPx>=5) return 'color';
    }
  }
  return 'bw';
}

// ── UTILS ──────────────────────────────────────────────────────────
function ptToMm(pt) { return pt*25.4/72; }
function money(v) { return `${Number(v).toFixed(2).replace('.',',')} ₽`; }
function fmt2(n) { const r=Math.round(n*10)/10; return r%1===0?String(r):r.toFixed(1); }
function fmtLabel(key) {
  if (FORMATS[key]) return `${key} (${FORMATS[key].w}×${FORMATS[key].h} мм)`;
  const m=/^([A][234])x(\d+)$/i.exec(key);
  if (m) { const base=m[1].toUpperCase(),n=+m[2]; return `${base}×${n} (${FORMATS[base].w*n}×${FORMATS[base].h} мм)`; }
  const custom = CUSTOM_PRICES.find(c => c.format===key);
  if (custom) return `${key} — ${custom.label}`;
  return key;
}
function escapeHtml(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sanitize(v) { return String(v||'').replace(/[\\/:*?"<>|]+/g,'_'); }
function makeId() { return 'r_'+Math.random().toString(36).slice(2,10); }
function compressRanges(pages) {
  if (!pages?.length) return '';
  const s=[...new Set(pages)].sort((a,b)=>a-b);
  const ranges=[]; let start=s[0],prev=s[0];
  for (let i=1;i<s.length;i++) {
    if (s[i]===prev+1) { prev=s[i]; continue; }
    ranges.push(start===prev?`${start}`:`${start}-${prev}`);
    start=prev=s[i];
  }
  ranges.push(start===prev?`${start}`:`${start}-${prev}`);
  return ranges.join(',');
}
function parseWideKey(key) {
  const m=/^([A][234])x(\d+)$/i.exec(String(key));
  return m?{base:m[1].toUpperCase(),n:+m[2]}:null;
}
